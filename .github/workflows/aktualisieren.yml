name: Welten aktualisieren

on:
  schedule:
    - cron: "17 4 * * 1"   # montags 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["regeln.json", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: welten-aktualisieren
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python3 -m unittest discover -s scripts

      - name: welten.json erzeugen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/aktualisieren.py

      - name: Prüfen und committen
        run: |
          python3 -c "import json; json.load(open('welten.json'))"
          if git diff --quiet -- welten.json; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add welten.json
          git commit -m "Welten aktualisiert"
          git push
